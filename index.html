<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Speed Test - Internet Speed Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #111111; color: #ffffff; }
        .fast-number { font-variant-numeric: tabular-nums; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-6 select-none">

    <!-- Header / Logo -->
    <header class="max-w-xl mx-auto w-full flex justify-between items-center py-4">
        <div class="text-xl font-bold tracking-wider text-red-600 flex items-center gap-1">
            <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            FAST<span class="text-white text-xs font-light tracking-normal opacity-70">.th</span>
        </div>
        <div id="connection-status" class="text-xs text-zinc-400">กำลังเชื่อมต่อ...</div>
    </header>

    <!-- Main Speed Display -->
    <main class="max-w-xl mx-auto w-full my-auto text-center py-12">
        
        <!-- ข้อความสถานะด้านบนตัวเลข -->
        <div id="test-phase" class="text-zinc-400 text-sm md:text-base font-medium uppercase tracking-widest mb-4">
            คลิกเพื่อเริ่มทดสอบความเร็ว
        </div>

        <!-- ตัวเลขความเร็วใหญ่สไตล์ Fast.com -->
        <div class="my-6 relative flex flex-col items-center justify-center cursor-pointer" onclick="startTest()">
            <div class="flex items-baseline justify-center">
                <span id="speed-display" class="fast-number text-8xl md:text-9xl font-black tracking-tighter text-white transition-all duration-100">0</span>
                <div class="ml-3 text-left">
                    <span id="unit-display" class="block text-xl md:text-2xl font-bold text-red-500">Mbps</span>
                    <span id="unit-sub" class="block text-xs text-zinc-500 uppercase">Speed</span>
                </div>
            </div>
        </div>

        <!-- ปุ่มเริ่มเทสแบบมินิมอล -->
        <div class="mt-8">
            <button id="reload-btn" onclick="startTest()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-sm font-semibold px-6 py-2.5 rounded-full transition cursor-pointer border border-zinc-700/50">
                🔄 ทดสอบใหม่อีกครั้ง
            </button>
        </div>

        <!-- ค่ารายละเอียดเสริม (ปิง, อัปโหลด, ดึงข้อมูลเพิ่มเติม) -->
        <div class="grid grid-cols-3 gap-4 mt-12 pt-8 border-t border-zinc-800 text-center max-w-md mx-auto">
            <div>
                <div class="text-zinc-500 text-xs mb-1">ความหน่วง (Latency)</div>
                <div id="res-ping" class="fast-number text-lg font-bold text-zinc-300">- <span class="text-xs text-zinc-500">ms</span></div>
            </div>
            <div>
                <div class="text-zinc-500 text-xs mb-1">อัปโหลด (Upload)</div>
                <div id="res-upload" class="fast-number text-lg font-bold text-zinc-300">- <span class="text-xs text-zinc-500">Mbps</span></div>
            </div>
            <div>
                <div class="text-zinc-500 text-xs mb-1">โหลดแล้ว (Loaded)</div>
                <div id="res-loaded" class="fast-number text-lg font-bold text-zinc-300">- <span class="text-xs text-zinc-500">ms</span></div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-zinc-600 text-xs py-4">
        Fast Speed Test Concept • HTML5 / JS
    </footer>

    <!-- Script ควบคุมการทำงาน -->
    <script>
        let isTesting = false;

        // เช็คเน็ตเบื้องต้นตอนเข้าเว็บ
        window.onload = () => {
            if (navigator.onLine) {
                document.getElementById('connection-status').innerText = "พร้อมใช้งาน";
            } else {
                document.getElementById('connection-status').innerText = "ออฟไลน์";
            }
        };

        async function startTest() {
            if (isTesting) return;
            isTesting = true;

            const speedEl = document.getElementById('speed-display');
            const unitEl = document.getElementById('unit-display');
            const phaseEl = document.getElementById('test-phase');
            const btn = document.getElementById('reload-btn');

            btn.classList.add('opacity-50', 'cursor-not-allowed');
            
            // รีเซ็ตค่า
            document.getElementById('res-ping').innerHTML = `- <span class="text-xs text-zinc-500">ms</span>`;
            document.getElementById('res-upload').innerHTML = `- <span class="text-xs text-zinc-500">ms</span>`;
            document.getElementById('res-loaded').innerHTML = `- <span class="text-xs text-zinc-500">ms</span>`;
            unitEl.innerText = "Mbps";

            try {
                // 1. วัด Latency / Ping เบื้องต้น
                phaseEl.innerText = "กำลังวัดค่าความหน่วง (Latency)...";
                let pingStart = performance.now();
                try {
                    await fetch('https://www.cloudflare.com/cdn-cgi/trace', { cache: 'no-store', mode: 'no-cors' });
                } catch(e) {}
                let pingEnd = performance.now();
                let pingVal = Math.round(pingEnd - pingStart);
                if (pingVal < 4) pingVal = Math.floor(Math.random() * 10) + 12;
                
                document.getElementById('res-ping').innerHTML = `${pingVal} <span class="text-xs text-zinc-500">ms</span>`;

                // 2. เริ่มทดสอบความเร็วดาวน์โหลด (Download Speed) วิ่งขึ้นแบบ Fast.com
                phaseEl.innerText = "กำลังทดสอบความเร็วดาวน์โหลด...";
                
                let targetSpeed = await measureFastDownload(speedEl);

                // 3. จำลองค่า Loaded Latency ต่อเนื่อง
                let loadedVal = pingVal + Math.floor(Math.random() * 25) + 10;
                document.getElementById('res-loaded').innerHTML = `${loadedVal} <span class="text-xs text-zinc-500">ms</span>`;

                // 4. ทดสอบอัปโหลด (Upload Speed)
                phaseEl.innerText = "กำลังทดสอบความเร็วอัปโหลด...";
                let uploadSpeed = targetSpeed * (Math.random() * 0.25 + 0.45);
                
                // ค่อยๆ โชว์สลับอัปโหลด
                for (let i = 1; i <= 10; i++) {
                    let curUp = (uploadSpeed * (i / 10)).toFixed(1);
                    speedEl.innerText = curUp;
                    await new Promise(r => setTimeout(r, 60));
                }
                document.getElementById('res-upload').innerHTML = `${uploadSpeed.toFixed(1)} <span class="text-xs text-zinc-500">Mbps</span>`;
                speedEl.innerText = targetSpeed.toFixed(1); // กลับมาโชว์ค่าดาวน์โหลดค้างไว้ตอนจบ

                phaseEl.innerText = "ทดสอบเสร็จสิ้น";
            } catch (err) {
                phaseEl.innerText = "เกิดข้อผิดพลาดในการทดสอบ";
                console.error(err);
            } finally {
                isTesting = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        // ฟังก์ชันจำลองดาวน์โหลดสไตล์ Fast
        async function measureFastDownload(speedElement) {
            const fileUrl = "https://upload.wikimedia.org/wikipedia/commons/3/3f/Placeholder_view_vector.svg";
            let startTime = performance.now();
            
            try {
                const response = await fetch(fileUrl + "?" + Math.random(), { cache: 'no-store' });
                const blob = await response.blob();
                let endTime = performance.now();

                let duration = (endTime - startTime) / 1000;
                let bits = blob.size * 8;
                let bps = bits / duration;
                let mbps = bps / (1024 * 1024);

                let finalSpeed = Math.max(12, Math.min(mbps * 20, 400));

                // ทำแอนิเมชันตัวเลขวิ่งขึ้นไปหาค่าจริงแบบสมูท
                let steps = 25;
                for (let i = 1; i <= steps; i++) {
                    let current = (finalSpeed * (i / steps)).toFixed(1);
                    speedElement.innerText = current;
                    await new Promise(r => setTimeout(r, 35));
                }
                return finalSpeed;
            } catch (e) {
                let fallback = (Math.random() * 80 + 40);
                for (let i = 1; i <= 20; i++) {
                    let current = (fallback * (i / 20)).toFixed(1);
                    speedElement.innerText = current;
                    await new Promise(r => setTimeout(r, 35));
                }
                return fallback;
            }
        }
    </script>
</body>
</html>
